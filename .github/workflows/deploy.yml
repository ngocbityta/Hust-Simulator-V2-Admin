name: Build and Deploy Admin UI to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: hustsimulator
  GAR_LOCATION: asia-southeast1
  REPOSITORY: hustsim-repo
  CLUSTER_NAME: hustsim-cluster
  CLUSTER_ZONE: asia-southeast1
  NAMESPACE: hustsim
  IMAGE_NAME: admin-ui
  VITE_API_URL: https://hustsimulator.id.vn/api
  VITE_WS_URL: wss://hustsimulator.id.vn/ws

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - id: auth
      name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |-
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_ZONE }}

    - name: Build and Push Docker Image
      run: |-
        REGISTRY="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}"
        FULL_IMAGE_NAME="$REGISTRY/${{ env.IMAGE_NAME }}:latest"
        
        docker build \
          --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
          --build-arg VITE_WS_URL=${{ env.VITE_WS_URL }} \
          -t "$FULL_IMAGE_NAME" .
        
        docker push "$FULL_IMAGE_NAME"
        echo "✅ Pushed $FULL_IMAGE_NAME"

    - name: Rollout Restart Deployment
      run: |-
        kubectl rollout restart deployment ${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }}
        
    - name: Wait for Rollout to Complete
      run: |-
        echo "⏳ Waiting for admin-ui..."
        kubectl rollout status deployment ${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s
        echo "✅ Admin UI deployed successfully!"
